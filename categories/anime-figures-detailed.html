<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anime Figures Detailed | ZENTRO</title>
<style>
:root{--yellow:#ffcf00;--peach:#fff0df;--orange:#f36b21;--ink:#202020;--muted:#71675f;--line:#eadfd3;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--peach);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.top{background:var(--yellow);padding:13px max(4%,calc((100% - 1320px)/2));display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;border-bottom:1px solid #e5b900}
.brand{font-size:25px;font-weight:900;letter-spacing:2px}
.nav{display:flex;gap:24px;font-size:14px;font-weight:800}
.nav a:hover{text-decoration:underline}
.wrap{max-width:1320px;margin:auto;padding:22px 24px 60px}
.crumb{font-size:13px;color:var(--muted);margin:7px 0 18px}
.crumb a{text-decoration:underline}
.hero{background:var(--orange);border-radius:18px;padding:30px 34px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:165px;overflow:hidden}
.hero h1{font-size:clamp(29px,4vw,46px);margin:0 0 10px;line-height:1.08}
.hero p{margin:0;font-size:15px;line-height:1.5}
.hero-stamp{flex:0 0 auto;border:3px solid rgba(255,255,255,.8);border-radius:50%;width:118px;height:118px;display:grid;place-items:center;text-align:center;font-weight:900;line-height:1.1;transform:rotate(9deg)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:25px 0 16px}
.count{font-weight:800}
.controls{display:flex;gap:9px;flex-wrap:wrap}
input,select{font:inherit}
.search{width:min(260px,65vw);background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 13px}
select{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.layout{display:grid;grid-template-columns:215px minmax(0,1fr);gap:18px;align-items:start}
.filters,.product{background:#fff;border:1px solid var(--line);border-radius:13px}
.filters{padding:17px;position:sticky;top:12px}
.filters h3{margin:0 0 13px;font-size:17px}
.filter-group{padding:13px 0;border-top:1px solid var(--line)}
.filter-group strong{display:block;margin-bottom:9px}
.filter-group label{display:flex;align-items:center;gap:8px;font-size:13px;margin:9px 0;color:#514a44}
.filter-group input{accent-color:var(--orange)}
.products-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.product{padding:11px;display:flex;flex-direction:column;min-width:0;transition:transform .18s,box-shadow .18s}
.product:hover{transform:translateY(-3px);box-shadow:0 8px 22px #5d3d2117}
.photo{height:174px;border-radius:9px;background:#f8f4ef;display:grid;place-items:center;overflow:hidden;margin-bottom:11px}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.photo .fallback{font-size:12px;color:#8a8177;text-align:center;padding:10px}
.product h3{font-size:14px;line-height:1.35;margin:0 0 7px;min-height:38px}
.stock{font-size:12px;color:#42734a;margin:0 0 8px}
.stock.out{color:#a33}
.price-line{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-top:auto}
.price{font-size:16px;font-weight:900}
.old{font-size:12px;color:#8a8177;text-decoration:line-through}
.add{margin-top:11px;border:0;border-radius:8px;background:var(--yellow);padding:11px 8px;font-weight:900;cursor:pointer;color:#202020}
.add:hover{background:#f3bd00}
.no-results{background:#fff;border:1px dashed #d6c8b8;border-radius:12px;padding:24px;color:#62584e;grid-column:1/-1}
.back{display:inline-block;margin-top:25px;font-weight:800;text-decoration:underline}
@media(max-width:1050px){.products-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.layout{grid-template-columns:1fr}.filters{position:static}.products-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-stamp{width:90px;height:90px;font-size:12px}}
@media(max-width:480px){.wrap{padding:15px 12px 40px}.top{padding:12px 15px}.nav{gap:13px;font-size:12px}.brand{font-size:22px}.hero{padding:23px 20px;min-height:145px}.hero-stamp{display:none}.photo{height:140px}.product{padding:9px}.product h3{font-size:13px}.price{font-size:14px}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="../index.html">ZENTRO</a>
  <nav class="nav">
    <a href="../index.html">HOME</a>
    <a href="../index.html#categories">CATEGORIES</a>
    <a href="https://wa.me/94778801926">WHATSAPP</a>
  </nav>
</header>

<main class="wrap">
  <div class="crumb"><a href="../index.html">Home</a>　›　<a href="../index.html#categories">Categories</a>　›　<strong>Anime Figures Detailed</strong></div>

  <section class="hero">
    <div>
      <h1>Anime Figures Detailed</h1>
      <p>Discover collectible characters and bring your favourite anime worlds home.</p>
    </div>
    <div class="hero-stamp">ZENTRO<br>FIGURE<br>COLLECTION</div>
  </section>

  <div class="tools">
    <div class="count">Showing <span id="count">0</span> products</div>
    <div class="controls">
      <input class="search" id="search" type="search" placeholder="Search figures..." aria-label="Search figures">
      <select id="sort" aria-label="Sort products">
        <option value="featured">Sort: Featured</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
        <option value="az">Name: A to Z</option>
      </select>
    </div>
  </div>

  <div class="layout">
    <aside class="filters">
      <h3>Filter By</h3>
      <div class="filter-group">
        <strong>Collection</strong>
        <label><input type="checkbox" checked disabled> Anime figures</label>
      </div>
      <div class="filter-group">
        <strong>Availability</strong>
        <label><input type="checkbox" id="stockOnly"> In stock only</label>
      </div>
      <div class="filter-group">
        <strong>Price</strong>
        <label>Use the sort menu to arrange prices</label>
      </div>
    </aside>

    <section>
      <div class="products-grid" id="products"></div>
    </section>
  </div>
  <a class="back" href="../index.html">← Back to ZENTRO homepage</a>
</main>

<script>
/* Products below are taken from the existing ZENTRO homepage catalogue.
   Image paths are relative to this file in /categories/. */
const products = [
  {id:5,name:"Demon Slayer Anime Figures",image:"../demon-slayer-bunny-figures.jpg",price:2399,old:3498,stock:143},
  {id:6,name:"Demon Slayer Mini Figures",image:"../demon-slayer-mini-figures.jpg",price:2099,old:2899,stock:121},
  {id:8,name:"Naruto Akatsuki Mini Figures",image:"../naruto-akatsuki-figures.jpg",price:3099,old:3599,stock:121},
  {id:15,name:"Death Note Sleeping Character",image:"../images/product-05-death-note-sleeping-characters.jpg",price:989,old:2199,stock:191},
  {id:17,name:"Katsuki Bakugo Anime Figure",image:"../images/product-07-katsuki-bakugo.jpg",price:6300,old:8989,stock:112},
  {id:18,name:"Gojo & Geto Figure",image:"../images/product-08-gojo-geto.jpg",price:6289,old:9699,stock:213},
  {id:19,name:"Jujutsu Kaisen Anime Figure Set",image:"../images/product-09-jujutsu-kaisen-set.jpg",price:4399,old:8799,stock:176},
  {id:20,name:"Kauruko Waguri Anime Girl Figure",image:"../images/product-10-pink-outfit-anime-girl.jpg",price:3989,old:5499,stock:134},
  {id:27,name:"Flame Phoenix Figure",image:"../images/product-27-flame-phoenix-figure[1].webp",price:3999,old:5999,stock:123},
  {id:36,name:"Whole Pack Halloween Figures",image:"../images/product-36-halloween-figures[1].webp",price:1199,old:3198,stock:162}
];

const grid=document.getElementById("products");
const count=document.getElementById("count");
const sort=document.getElementById("sort");
const search=document.getElementById("search");
const stockOnly=document.getElementById("stockOnly");

function render(){
  let items=[...products];
  const term=search.value.trim().toLowerCase();
  if(term) items=items.filter(p=>p.name.toLowerCase().includes(term));
  if(stockOnly.checked) items=items.filter(p=>p.stock>0);
  if(sort.value==="low") items.sort((a,b)=>a.price-b.price);
  if(sort.value==="high") items.sort((a,b)=>b.price-a.price);
  if(sort.value==="az") items.sort((a,b)=>a.name.localeCompare(b.name));
  count.textContent=items.length;

  if(!items.length){
    grid.innerHTML='<div class="no-results">No figures match your search. Try another name.</div>';
    return;
  }

  grid.innerHTML=items.map(p=>`
    <article class="product">
      <div class="photo">
        <img src="${p.image}" alt="${p.name}" loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.hidden=false">
        <div class="fallback" hidden>Image unavailable</div>
      </div>
      <h3>${p.name}</h3>
      <p class="stock ${p.stock>0?'':'out'}">${p.stock>0?'In stock':'Out of stock'}</p>
      <div class="price-line">
        <span class="price">LKR ${p.price.toLocaleString("en-LK")}</span>
        <span class="old">LKR ${p.old.toLocaleString("en-LK")}</span>
      </div>
      <button class="add" type="button" onclick="orderProduct(${p.id})">Order via WhatsApp</button>
    </article>
  `).join("");
}

function orderProduct(id){
  const p=products.find(item=>item.id===id);
  if(!p)return;
  const message=`Hi ZENTRO, I would like to order: ${p.name} (LKR ${p.price.toLocaleString("en-LK")}).`;
  window.open("https://wa.me/94778801926?text="+encodeURIComponent(message),"_blank");
}

sort.addEventListener("change",render);
search.addEventListener("input",render);
stockOnly.addEventListener("change",render);
render();
</script>
</body>
</html>
